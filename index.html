<!DOCTYPE html>
<html>
<head>
<style>
.cover img{
    width: 100%;
    height: 500px;
    object-fit: cover;
    display: block;
    transition: 1s;
}

.cover img:hover{
    transform: rotate(360deg);
}
</style>
</head>
<body>

<div class="cover">
    <img src="nenulocal.jpg" alt="Cover Image"><br>
     <audio controls>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
</div>

</body>
</html>
