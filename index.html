<!DOCTYPE html>
<html>
<head>
<title>NENU LOCAL</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
color:white;
font-family:Arial,sans-serif;
text-align:center;
overflow-x:hidden;
}

/* Welcome Screen */

#welcome{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-size:55px;
font-weight:bold;
color:gold;
z-index:9999;
animation:hideScreen 3s forwards;
}

@keyframes hideScreen{

0%{opacity:1;}

80%{opacity:1;}

100%{
opacity:0;
visibility:hidden;
}

}

/* Cover */

.cover{
position:relative;
overflow:hidden;
}

.cover img{
width:100%;
height:500px;
object-fit:cover;
}

/* Moving Title */

.name{
position:absolute;
top:50%;
left:-100%;
font-size:60px;
font-weight:bold;
color:white;
text-shadow:0 0 20px red;
animation:
move 8s linear infinite,
float 2s ease-in-out infinite,
glow 1s infinite alternate;
}

@keyframes move{

from{
left:-100%;
}

to{
left:100%;
}

}

@keyframes float{

0%{
transform:translateY(-10px);
}

50%{
transform:translateY(10px);
}

100%{
transform:translateY(-10px);
}

}

@keyframes glow{

from{
text-shadow:0 0 10px red;
}

to{
text-shadow:0 0 40px yellow;
}

}

audio{
margin-top:20px;
}

video{
margin-top:20px;
border-radius:15px;
}

</style>

</head>

<body>

<div id="welcome">
WELCOME TO NENU LOCAL
</div>

<div class="cover">

<img src="nenulocal.jpg">

<div class="name">
NENU LOCAL
</div>

</div>

<br>

<audio id="music" controls loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<br><br>

<video controls width="700">
<source src="Next.mp4" type="video/mp4">
</video>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script>

/* Confetti */

window.onload=function(){

var end=Date.now()+5000;

var timer=setInterval(function(){

if(Date.now()>end){

clearInterval(timer);

return;

}

confetti({

particleCount:120,

spread:360,

startVelocity:55,

origin:{

x:Math.random(),

y:Math.random()-0.2

}

});

},250);

}

/* Auto Play Music after First Click */

document.addEventListener("click",function(){

document.getElementById("music").play();

},{once:true});

</script>

</body>
</html>
