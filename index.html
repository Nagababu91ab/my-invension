<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NENU LOCAL</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#000;
    color:#fff;
    overflow-x:hidden;
}

/* Background Video */
#bgVideo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Dark Overlay */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    z-index:-1;
}

/* Movie Title */
.title{
    position:absolute;
    top:20%;
    left:-100%;
    font-size:60px;
    font-weight:bold;
    color:#fff;
    text-shadow:0 0 20px red;
    animation:move 8s linear infinite,
              float 2s ease-in-out infinite,
              glow 1s infinite alternate;
}

@keyframes move{
    from{left:-100%;}
    to{left:100%;}
}

@keyframes float{
    0%{transform:translateY(-10px);}
    50%{transform:translateY(10px);}
    100%{transform:translateY(-10px);}
}

@keyframes glow{
    from{ text-shadow:0 0 10px red; }
    to{ text-shadow:0 0 40px yellow; }
}

.content{
    position:relative;
    margin-top:650px;
    text-align:center;
}

.cover{
    width:700px;
    border-radius:15px;
}

audio,
video{
    margin-top:20px;
}
</style>

</head>
<body>

<!-- Background Video -->
<video id="bgVideo" autoplay muted loop playsinline>
    <source src="Next.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="title">
NENU LOCAL
</div>

<div class="content">

<img src="nenulocal.jpg" class="cover">

<br><br>

<audio controls loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<br><br>

<video width="700" controls autoplay muted loop playsinline>
    <source src="Next.mp4" type="video/mp4">
</video>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script>
window.onload=function(){

const end=Date.now()+5000;

const timer=setInterval(function(){

if(Date.now()>end){
clearInterval(timer);
return;
}

confetti({
particleCount:120,
spread:360,
startVelocity:60,
origin:{
x:Math.random(),
y:Math.random()-0.2
}

});

},250);

};
</script>

</body>
</html>
